---
name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target
      RELEASE_TARGET: linux-x86_64-gnu
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p murald --locked)"
          version="${version##*#}"
          release_tag="v${version}"
          grep -Eq "^## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" \
            CHANGELOG.md
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$release_tag" ]]
          fi
          printf 'release-tag=%s\n' "$release_tag" >>"$GITHUB_OUTPUT"

      - name: Verify signed tag and release gates
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/$1"
          }

          ref=$(api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          [[ $(jq -r '.object.type' <<<"$ref") == tag ]]
          tag_sha=$(jq -r '.object.sha' <<<"$ref")
          tag=$(api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")
          jq -e \
            --arg name "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            '.tag == $name and
             .object.type == "commit" and
             .object.sha == $commit and
             .verification.verified == true and
             .verification.reason == "valid"' \
            <<<"$tag" >/dev/null

          compare=$(api \
            "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main")
          jq -e \
            --arg commit "$GITHUB_SHA" \
            '(.status == "identical" or .status == "ahead") and
             .merge_base_commit.sha == $commit' \
            <<<"$compare" >/dev/null
          branch=$(api "repos/${GITHUB_REPOSITORY}/branches/main")
          [[ $(jq -r '.protected' <<<"$branch") == true ]]

          rulesets=$(api \
            "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true")
          branch_protected=false
          while IFS= read -r id; do
            ruleset=$(api "repos/${GITHUB_REPOSITORY}/rulesets/${id}")
            if jq -e '
              (.conditions.ref_name.include |
                any(. == "~DEFAULT_BRANCH" or . == "refs/heads/main")) and
              ([.rules[].type] |
                contains(["deletion", "non_fast_forward", "pull_request"])) and
              ([.rules[] |
                  select(.type == "required_status_checks") |
                  .parameters.strict_required_status_checks_policy] |
                any(. == true)) and
              ([.rules[] |
                  select(.type == "required_status_checks") |
                  .parameters.required_status_checks[].context] as $checks |
                ["Test (Rust 1.95.0)",
                 "Test (Rust stable)",
                 "Format, lint, docs, and packaging",
                 "RustSec advisory scan"] - $checks | length == 0)
            ' <<<"$ruleset" >/dev/null; then
              branch_protected=true
              break
            fi
          done < <(
            jq -r '.[] |
              select(.target == "branch" and .enforcement == "active") | .id' \
              <<<"$rulesets"
          )
          [[ "$branch_protected" == true ]]

          tags_protected=false
          while IFS= read -r id; do
            ruleset=$(api "repos/${GITHUB_REPOSITORY}/rulesets/${id}")
            if jq -e '
              (.conditions.ref_name.include |
                any(. == "refs/tags/v*")) and
              ([.rules[].type] |
                contains(["deletion", "non_fast_forward"]))
            ' <<<"$ruleset" >/dev/null; then
              tags_protected=true
              break
            fi
          done < <(
            jq -r '.[] |
              select(.target == "tag" and .enforcement == "active") | .id' \
              <<<"$rulesets"
          )
          [[ "$tags_protected" == true ]]

          check_runs=$(api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100&filter=latest")
          jq -e '
            ["Test (Rust 1.95.0)",
             "Test (Rust stable)",
             "Format, lint, docs, and packaging",
             "RustSec advisory scan"] as $required |
            [.check_runs[] |
              select(.status == "completed" and .conclusion == "success") |
              .name] as $successful |
            ($required - $successful | length) == 0
          ' <<<"$check_runs" >/dev/null

      - name: Install native dependencies and validators
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            binutils \
            file \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install release Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Package release assets
        env:
          BINARY_DIR: target/release
          OUTPUT_DIR: dist
          RELEASE_REF: ${{ github.sha }}
        run: |
          scripts/package-release.sh \
            "${{ steps.metadata.outputs.release-tag }}" \
            "$RELEASE_TARGET"
          scripts/verify-release-assets.sh \
            "${{ steps.metadata.outputs.release-tag }}" \
            "$RELEASE_TARGET" \
            dist \
            "$GITHUB_SHA"
          git diff --exit-code

      - name: Upload release assets
        id: upload
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: Attest release assets
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          path: dist

      - name: Verify release assets
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest build provenance
        # actions/attest v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish:
    name: Publish immutable release
    if: github.ref_type == 'tag'
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download attested release assets
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          path: dist

      - name: Verify release assets
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "refusing to replace existing release ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --draft \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          local_assets=$(
            for file in dist/*; do
              jq -cn \
                --arg name "$(basename "$file")" \
                --arg digest "sha256:$(sha256sum "$file" | cut -d ' ' -f 1)" \
                --argjson size "$(stat -c %s "$file")" \
                '{name: $name, digest: $digest, size: $size}'
            done | jq -s 'sort_by(.name)'
          )
          remote=$(
            gh release view "$GITHUB_REF_NAME" \
              --json assets,isDraft \
              --repo "$GITHUB_REPOSITORY"
          )
          [[ $(jq -r '.isDraft' <<<"$remote") == true ]]
          remote_assets=$(
            jq \
              '[.assets[] | {name, digest, size}] | sort_by(.name)' \
              <<<"$remote"
          )
          [[ "$remote_assets" == "$local_assets" ]]

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag

      - name: Verify immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(
            gh release view "$GITHUB_REF_NAME" \
              --json isDraft,isImmutable,isPrerelease,tagName \
              --repo "$GITHUB_REPOSITORY"
          )
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            '.tagName == $tag and
             .isDraft == false and
             .isPrerelease == false and
             .isImmutable == true' \
            <<<"$release" >/dev/null
